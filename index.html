<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Instant Redirect to YTMP3 -->
    <meta http-equiv="refresh" content="0;url=https://epll.pl/">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .container { text-align: center; padding: 20px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #d2d2d7; border-top: 4px solid #0071e3;
            border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #0071e3; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Redirecting to download station...</h2>
        <p>If not redirected automatically, <a href="https://epll.pl/">click here</a>.</p>
    </div>
    <script>
        window.location.href = "https://epll.pl/";
    </script>
</body>
</html>
